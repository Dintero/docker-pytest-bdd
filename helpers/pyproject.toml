[project]
name = "dintero-e2e"
version = "0.2.0"
description = "Helpers for Dintero E2E test suites — imported by pytest-bdd feature files running inside dintero/docker-pytest-bdd, plus ZAP scan orchestration CLIs."
requires-python = ">=3.10"

[project.scripts]
dintero-zap = "dintero_e2e.zap.cli:main"
dintero-zap-to-asff = "dintero_e2e.zap.asff:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dintero_e2e*"]
